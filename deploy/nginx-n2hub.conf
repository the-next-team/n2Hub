server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
    }

    location = /index.html {
        expires -1;
    }

    location /oo-proxy/ {
        proxy_pass http://172.17.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Access-Control-Allow-Origin *;
    }

    client_max_body_size 100M;
}
