server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅: /projects/xxx 같은 경로 새로고침 시 index.html로 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐싱 (js/css는 파일명에 해시가 있어 장기 캐시 안전)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html은 캐시 금지 (새 배포 즉시 반영)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 업로드 파일 크기 제한 완화
    client_max_body_size 100M;
}
