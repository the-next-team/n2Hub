# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name _;
    return 301 https://$host:8444$request_uri;
}

# HTTPS (self-signed cert, port 8444 on host)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/n2hub.crt;
    ssl_certificate_key /etc/nginx/ssl/n2hub.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐싱
    location /assets/ {
        expires 30d;
    }

    # index.html 캐시 금지
    location = /index.html {
        expires -1;
    }

    # OO 역방향 프록시 — CORS 우회
    location /oo-proxy/ {
        proxy_pass http://172.17.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Access-Control-Allow-Origin *;
    }

    client_max_body_size 100M;
}
