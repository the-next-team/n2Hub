<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:40px 0;">
    <tr><td align="center">
      <table width="560" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);">

        <!-- 헤더 -->
        <tr>
          <td style="background:linear-gradient(135deg,#6366f1,#8b5cf6);padding:32px 40px;">
            <h1 style="margin:0;color:#fff;font-size:22px;font-weight:700;">NEXT Hub</h1>
            <p style="margin:4px 0 0;color:rgba(255,255,255,.8);font-size:13px;">IT 프로젝트 산출물 통합관리</p>
          </td>
        </tr>

        <!-- 본문 -->
        <tr>
          <td style="padding:36px 40px;">
            <p style="margin:0 0 8px;font-size:18px;color:#111827;font-weight:700;">
              환영합니다! 🎉
            </p>
            <p style="margin:0 0 28px;font-size:15px;color:#374151;line-height:1.6;">
              NEXT Hub 회원가입을 거의 다 마쳤습니다.<br>
              아래 버튼을 눌러 이메일 인증을 완료해주세요.
            </p>

            <!-- CTA 버튼 -->
            <table cellpadding="0" cellspacing="0">
              <tr>
                <td style="background:#6366f1;border-radius:8px;">
                  <a href="{{ .ConfirmationURL }}"
                     style="display:inline-block;padding:13px 32px;color:#fff;font-size:15px;font-weight:600;text-decoration:none;">
                    이메일 인증하기 →
                  </a>
                </td>
              </tr>
            </table>

            <p style="margin:24px 0 0;font-size:12px;color:#9ca3af;line-height:1.7;">
              버튼이 동작하지 않으면 아래 링크를 브라우저에 직접 붙여넣어 주세요.<br>
              <a href="{{ .ConfirmationURL }}" style="color:#6366f1;word-break:break-all;">{{ .ConfirmationURL }}</a>
            </p>

            <hr style="border:none;border-top:1px solid #e5e7eb;margin:28px 0;">

            <p style="margin:0;font-size:12px;color:#9ca3af;line-height:1.6;">
              본인이 가입한 것이 아니라면 이 메일을 무시하셔도 됩니다.<br>
              이 이메일은 NEXT Hub에서 자동 발송됐습니다. 문의:
              <a href="mailto:support@n2soft.co.kr" style="color:#6366f1;">support@n2soft.co.kr</a>
            </p>
          </td>
        </tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
